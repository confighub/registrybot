#
# manifests/registrybot.yaml's Deployment. Its credentials are in the
# registrybot-secrets Secret, which is not part of the package: create it in
# the install namespace yourself, or with your secret store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registrybot
  namespace: confighubplaceholder
  labels:
    app: registrybot
spec:
  # One replica: the poll loop and the webhook queue are per-process, and two
  # replicas would race each other writing the same fact units.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registrybot
  template:
    metadata:
      labels:
        app: registrybot
    spec:
      serviceAccountName: registrybot
      automountServiceAccountToken: false
      # Meets the Pod Security Standards "restricted" level. The image runs as
      # 1000:3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registrybot
          # kustomization.yaml pins the image tag.
          image: ghcr.io/confighub/registrybot
          ports:
            - name: http
              containerPort: 8080
          env:
            # ── ConfigHub connection (required) ──────────────────────────────
            - name: CONFIGHUB_URL
              value: "https://hub.confighub.com"
            # The service account's private key, registered with
            # `cub serviceaccount key add`. The value is the JWK itself or a
            # path to it.
            - name: CONFIGHUB_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: registrybot-secrets
                  key: CONFIGHUB_AUTH_PRIVATE_KEY
            # Local development only: a static session token, never refreshed.
            # Set this INSTEAD of the private key (exactly one credential kind
            # is allowed).
            # - name: CONFIGHUB_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: registrybot-secrets
            #       key: CONFIGHUB_TOKEN

            # ── Configuration document (required) ────────────────────────────
            # The AppConfig/YAML unit that says which repositories to watch.
            # Re-read every poll cycle; see examples/registrybot-config.yaml.
            - name: REGISTRYBOT_CONFIG_SPACE
              value: "registrybot"
            - name: REGISTRYBOT_CONFIG_UNIT
              value: "registrybot"

            # ── GitHub (required) ────────────────────────────────────────────
            # Classic PAT with read:packages, or a GitHub App installation token
            # with packages: read. Used to list package versions.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: registrybot-secrets
                  key: GITHUB_TOKEN
            # GitHub Enterprise Server: point at its API instead.
            # - name: GITHUB_API_URL
            #   value: "https://api.github.com"

            # ── Webhooks (optional) ──────────────────────────────────────────
            # The secret GitHub signs deliveries with. Absent = webhook endpoint
            # disabled, polling only. Expose POST /webhooks/github to GitHub
            # (Ingress/Gateway of your choosing) when you set it.
            # - name: GITHUB_WEBHOOK_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: registrybot-secrets
            #       key: GITHUB_WEBHOOK_SECRET

            # ── Polling ──────────────────────────────────────────────────────
            # Default poll interval; the configuration document's pollInterval
            # overrides it.
            - name: REGISTRYBOT_POLL_INTERVAL
              value: "5m"
            - name: REGISTRYBOT_LISTEN_ADDR
              value: ":8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
