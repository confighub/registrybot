name: build

# Tests plus development image builds for branches and PRs. Tagged releases
# (semver image + config bundle) are handled by release.yml, so this workflow
# does not run on tags and never produces a semver or :latest image.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/confighub/registrybot

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: [test]
    # GitHub-hosted amd64 runner. The Go binary is cross-compiled natively on it
    # for both targets (see Dockerfile); QEMU is only registered so buildx can
    # assemble the arm64 image layers, never to run an emulated compile.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Match release.yml: dev images have to be runnable on the same
          # architectures as released ones, or a branch build is untestable
          # exactly where a release would be.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
