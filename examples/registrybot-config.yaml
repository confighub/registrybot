# registrybot configuration document.
#
# This is the content of the AppConfig/YAML unit registrybot reads its
# configuration from (REGISTRYBOT_CONFIG_SPACE / REGISTRYBOT_CONFIG_UNIT). It is
# re-read every poll cycle, so editing the unit in ConfigHub reconfigures the
# running bot. Create it with:
#
#   cub unit create --space registrybot --toolchain AppConfig/YAML \
#     registrybot examples/registrybot-config.yaml
#
# Every key except repositories[].repository is optional.
#
# With an organization-level webhook, discovery lets images that are not listed
# here get fact units too; see the discovery section below.

# How often to poll GitHub for every repository. Overrides the bot's
# REGISTRYBOT_POLL_INTERVAL. Webhooks make the bot look sooner; polling is what
# guarantees it eventually sees everything.
pollInterval: 5m

# How long a repository is left to settle after a webhook before it is
# reconciled. One image push arrives as many package events over a few minutes
# (per-architecture manifests, buildcache tags, the manifest list, then the
# cosign signature and attestation); reconciling on each one writes a revision
# per intermediate state. The bot waits until `settle` has passed with no
# further delivery, capped at `maxDelay` from the first one, then reconciles
# once. The poll leaves a settling repository alone. `settle: 0` reconciles on
# every delivery. Defaults shown.
webhooks:
  settle: 2m
  maxDelay: 10m

# Applied to every repository that does not set the field itself.
defaults:
  # Space (slug) the fact units are created in. Without this, the space the
  # configuration unit lives in is used.
  space: registry-facts
  # Tags to ignore entirely. Build-system noise is the usual reason.
  exclude: ["^sha-", "^pr-"]
  # Streams every repository gets in addition to the built-in "newest" and
  # "semver". A stream names one tag out of many; downstream units link to
  # streams.<name>.tag (or .digest) rather than to a raw tag list.
  streams:
    # Highest release version, prereleases excluded.
    stable: { semver: ">=0.0.0" }

# Opt-in: a signed package webhook for a repository not listed below creates
# a fact unit for it (using defaults) and polls it from then on. The fact units
# are the record; delete one to stop watching. Off unless fromWebhooks is true.
discovery:
  fromWebhooks: true
  owners: [confighub, confighubai]
  exclude: ["-preview$"]

repositories:
  # Minimal: the built-in streams, defaults for everything else. Fact unit slug
  # is derived (confighub-argobot).
  - repository: ghcr.io/confighub/argobot

  # Everything spelled out.
  - repository: ghcr.io/confighub/cubbychat
    space: registry-facts
    unit: cubbychat-image
    limit: 25
    exclude: ["^sha-"]
    streams:
      # Highest 1.x release.
      stable: { semver: ">=1.0.0 <2.0.0" }
      # Highest 2.x prerelease or release: a "-0" suffix admits prereleases.
      next: { semver: ">=2.0.0-0" }
      # Most recently pushed tag whose name is exactly "main".
      main: { pattern: "^main$" }
      # Override a built-in: "semver" becomes 1.x only.
      semver: { semver: "<2.0.0" }
