#
# registrybot needs no Kubernetes API access: it talks only to ConfigHub and
# GitHub. The ServiceAccount exists so the pod runs as a named identity with no
# token mounted, not because it grants anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registrybot
  namespace: confighubplaceholder
automountServiceAccountToken: false
