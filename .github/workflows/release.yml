name: release

# A release is cut by pushing a git tag vX.Y.Z. Two things are published, both
# versioned as the release and immutable:
#
#   * The container image, ghcr.io/confighub/registrybot:vX.Y.Z (and :latest).
#
#   * The installer package (package/), which runs that image, as
#     oci://ghcr.io/confighub/packages/registrybot:X.Y.Z, after the image.
#
# The manifest and the package name the release they run, so the version is set
# before the tag: scripts/set-version.sh vX.Y.Z, merged, then the tag. A tag
# they don't name fails here, before anything is pushed.
#
# manifests/registrybot.yaml is not published anywhere; it is applied from a
# checkout of the release tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/confighub/registrybot

jobs:
  # Build and push the semver image. The condition keeps a manual run on a
  # branch from publishing anything.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check that the deployments name this release
        run: scripts/set-version.sh --check "${{ github.ref_name }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # {{raw}} keeps the leading v, so the image tag equals the git tag
          # equals the tag the deployments name — no v-prefix mismatch.
          tags: |
            type=semver,pattern={{raw}}
            type=sha
          flavor: |
            latest=true

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # Attach an SPDX SBOM and provenance to the image manifest. Together with
          # the notice files copied into the image, this is the per-release
          # inventory of what the image contains:
          #   docker buildx imagetools inspect $IMAGE:<tag> --format '{{json .SBOM}}'
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish the installer package (package/), which runs the image just pushed,
  # as oci://ghcr.io/confighub/packages/registrybot:<version>, signed keylessly.
  # Tag events only: a package version is the release's, and is
  # published once. The image job has checked that the package names the tag.
  package:
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Keyless signing.
      id-token: write
    env:
      PACKAGE_REPO: ghcr.io/confighub/packages/registrybot
      # package.yml tests with the same one.
      INSTALLER_VERSION: v0.5.1
    steps:
      - uses: actions/checkout@v7

      - name: Install the installer
        run: |
          set -euo pipefail
          base="https://github.com/confighub/installer/releases/download/${INSTALLER_VERSION}"
          curl -fsSLO "${base}/installer-linux-amd64"
          curl -fsSLO "${base}/installer-linux-amd64.sha256"
          sha256sum -c installer-linux-amd64.sha256
          install -m 0755 installer-linux-amd64 /usr/local/bin/installer
          rm installer-linux-amd64 installer-linux-amd64.sha256

      - name: Test the package
        run: scripts/test-package.sh

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | installer login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version=$(yq -r .installerMetadata.version package/installer.yaml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          installer build package -o "${RUNNER_TEMP}/registrybot.tgz"

      - name: Check whether the version is published
        id: published
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if installer list "oci://${PACKAGE_REPO}" 2>/dev/null | grep -qx "$VERSION"; then
            echo "::notice::Package ${VERSION} is already published."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.published.outputs.exists == 'false'
        uses: sigstore/cosign-installer@v3

      - name: Push and sign
        if: steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          installer push "${RUNNER_TEMP}/registrybot.tgz" "oci://${PACKAGE_REPO}:${VERSION}"
          installer sign "oci://${PACKAGE_REPO}:${VERSION}" --yes
