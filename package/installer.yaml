apiVersion: installer.confighub.com/v1alpha1
kind: Package
metadata:
  name: registrybot
installerMetadata:
  # The registrybot release the package runs. Set it, and the
  # image tag in bases/default/kustomization.yaml, with
  # scripts/set-version.sh before tagging the release.
  version: v0.6.1
  # vet-pod-security-standard.
  installerVersion: ">= 0.3.0"
spec:
  bases:
    - name: default
      path: bases/default
      default: true
      description: |
        registrybot's Namespace, a ServiceAccount with no token, the
        single-replica Deployment, and a ClusterIP Service in front of its
        webhook receiver. It reads its credentials from the
        registrybot-secrets Secret, supplied out of band. One of the
        config-configmap and config-unit components adds where its
        configuration document comes from.

  components:
    - name: config-configmap
      path: components/config-configmap
      default: true
      description: |
        registrybot's configuration document ships with the Deployment, as the
        registrybot-config ConfigMap, mounted as a file. Uploaded to ConfigHub
        it is an AppConfig/YAML Unit, registrybot-config, in the install's
        Space: edit it there and publish, like the rest of the install.
    - name: config-unit
      path: components/config-unit
      description: |
        registrybot reads its configuration document from a ConfigHub Unit
        itself, every poll cycle, so a change to the Unit takes effect with no
        publish. The Unit is yours to create: registrybot, in the Space the
        config_space input names.
      transformers:
        - toolchain: Kubernetes/YAML
          description: Point registrybot at the Space of its configuration Unit.
          invocations:
            - name: set-env
              args:
                - registrybot
                - "REGISTRYBOT_CONFIG_SPACE={{ or .Inputs.config_space \"confighubplaceholder\" }}"
    - name: webhooks
      path: components/webhooks
      description: |
        Receive GitHub package webhooks at POST /webhooks/github, signed with
        the GITHUB_WEBHOOK_SECRET key of registrybot-secrets. Exposing the
        Service to GitHub is up to the cluster.

  componentGroups:
    - name: config-source
      description: Where registrybot reads its configuration document from.
      components: [config-configmap, config-unit]
      required: true

  # Every input has a default, so an install uploaded as a base for ConfigHub
  # variants can leave them unset, and each variant changes what differs.
  inputs:
    - name: config_space
      type: string
      default: registrybot
      prompt: Space of registrybot's configuration Unit (config-unit only)
      description: |
        Used with the config-unit component only: the Space of the
        AppConfig/YAML Unit that says which repositories to watch,
        REGISTRYBOT_CONFIG_SPACE. The Unit is named registrybot unless
        REGISTRYBOT_CONFIG_UNIT says otherwise.
    - name: confighub_url
      type: string
      default: https://hub.confighub.com
      prompt: ConfigHub URL as the cluster reaches it
      description: |
        The ConfigHub server registrybot connects to.
    - name: metrics
      type: bool
      default: true
      prompt: Serve Prometheus metrics?
      description: |
        Whether registrybot serves Prometheus metrics at /metrics. Sets
        METRICS_ENABLED; false opens no metrics port.

  transformers:
    - toolchain: Kubernetes/YAML
      description: Put registrybot in the install namespace.
      invocations:
        - name: set-namespace
          args: ["{{ .Namespace }}"]
    - toolchain: Kubernetes/YAML
      description: Connect registrybot to ConfigHub.
      invocations:
        - name: set-env
          args:
            - registrybot
            - "CONFIGHUB_URL={{ or .Inputs.confighub_url \"confighubplaceholder\" }}"
            - "METRICS_ENABLED={{ .Inputs.metrics }}"
    - toolchain: Kubernetes/YAML
      whereResource: "ConfigHub.ResourceType = 'apps/v1/Deployment'"
      description: With metrics off, expose no metrics port.
      invocations:
        - name: set-yq
          args:
            - >-
              with(select($params.metrics == "false"); .spec.template.spec.containers[] |= (select(.name == "registrybot") |= ( .ports |= map(select(.name != "metrics")) | select((.ports | length) == 0) |= del(.ports))))
            - "metrics={{ .Inputs.metrics }}"

  validators:
    - toolchain: Kubernetes/YAML
      invocations:
        - name: vet-schemas
        - name: vet-merge-keys
        - name: vet-format
        # A tag must be pinned: no :latest, and no untagged image, which means
        # latest. A colon counts as a tag only in the last path segment, so a
        # registry port is not one.
        - name: vet-images
          args: ['{"DenyRegexp": "(:latest$)|^([^/]+/)*[^/:@]+$"}']
        - name: vet-pod-security-standard
          args: [restricted]
